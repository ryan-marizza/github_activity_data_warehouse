[project]
name = "ghwh"
version = "0.1.0"
description = ""
authors = [
    {name = "ryanmarizza",email = "ryan.marizza@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "databricks-sdk (>=0.137.0,<0.138.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)"
]

[tool.poetry]
packages = [{ include = "ghwh" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.6,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
